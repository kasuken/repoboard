name: Website

# Builds the Astro site in site/ and publishes it to GitHub Pages.
# For a custom domain: add the DNS record (CNAME to kasuken.github.io, or A/AAAA for an apex domain),
# set the domain in Settings > Pages and Enforce HTTPS, then set SITE_URL below to it and BASE_PATH to "/".
# No CNAME file is needed: Pages ignores it when publishing from a workflow.
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://kasuken.github.io
      BASE_PATH: /repoboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
